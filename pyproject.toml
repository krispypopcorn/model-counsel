[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-counsel"
version = "0.1.0"
description = "Sequential CrewAI workflow for evidence-first contract-supply opportunity research."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "crewai==1.15.7",
  "crewai-tools==1.15.7",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
model-counsel = "model_counsel.cli:main"
model-counsel-prepare-procurement = "model_counsel.procurement:main"
model-counsel-prepare-buyers = "model_counsel.buyer_universe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/model_counsel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
